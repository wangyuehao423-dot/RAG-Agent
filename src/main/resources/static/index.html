<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业知识库问答助手</title>
<style>
:root {
  --bg: #f5f7fa;
  --panel: #ffffff;
  --border: #e2e8f0;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --text: #1e293b;
  --text-2: #64748b;
  --danger: #dc2626;
  --ok: #16a34a;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: linear-gradient(135deg, #1e3a8a, #2563eb);
  color: #fff;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
header h1 { font-size: 20px; font-weight: 600; }
header .sub { font-size: 13px; opacity: .85; margin-top: 2px; }
main { flex: 1; display: flex; min-height: 0; }
aside {
  width: 280px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
aside section { padding: 16px; border-bottom: 1px solid var(--border); }
aside h2 { font-size: 13px; color: var(--text-2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
.btn {
  border: none;
  border-radius: 6px;
  padding: 8px 14px;
  font-size: 13px;
  cursor: pointer;
  transition: background .15s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid #fecaca; padding: 3px 8px; font-size: 12px; }
.btn-danger:hover { background: #fef2f2; }
.upload-row { display: flex; gap: 8px; align-items: center; }
.upload-row input[type=file] { font-size: 12px; flex: 1; min-width: 0; }
.upload-row .btn { flex-shrink: 0; white-space: nowrap; }
.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 8px;
  font-size: 13px;
  cursor: pointer;
  background: #fff;
  transition: border-color .15s;
}
.list-item:hover { border-color: var(--primary); }
.list-item.active { border-color: var(--primary); background: #eff6ff; }
.list-item .meta { font-size: 11px; color: var(--text-2); margin-top: 3px; }
.badge { font-size: 11px; padding: 1px 8px; border-radius: 99px; }
.badge.ok { background: #dcfce7; color: var(--ok); }
.badge.err { background: #fee2e2; color: var(--danger); }
.empty-hint { color: var(--text-2); font-size: 12px; text-align: center; padding: 12px 0; }
#chatArea {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.msg { max-width: 75%; padding: 10px 14px; border-radius: var(--radius); font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg.system { align-self: center; background: #f1f5f9; color: var(--text-2); font-size: 12px; }
.msg.err { align-self: flex-start; background: #fef2f2; border: 1px solid #fecaca; color: var(--danger); }
.sources {
  margin-top: 8px;
  border-top: 1px dashed var(--border);
  padding-top: 6px;
  font-size: 12px;
  color: var(--text-2);
}
.sources details { margin-top: 4px; }
.sources summary { cursor: pointer; }
.sources .src { padding: 4px 0; }
.sources .src b { color: var(--text); }
.sources .score { color: var(--primary); }
.typing::after { content: "▍"; animation: blink 1s infinite; color: var(--primary); }
@keyframes blink { 50% { opacity: 0; } }
#inputBar {
  display: flex;
  gap: 10px;
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  background: var(--panel);
}
#question {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 14px;
  resize: none;
  outline: none;
  font-family: inherit;
}
#question:focus { border-color: var(--primary); }
#sendBtn { align-self: stretch; padding: 0 24px; font-size: 14px; }
#statusBar { padding: 6px 24px; font-size: 12px; color: var(--text-2); background: #f8fafc; border-top: 1px solid var(--border); }
#newChatBtn { width: 100%; margin-bottom: 12px; }

/* ---------- 引用来源：可点击跳原文 ---------- */
.sources .src.clickable {
  cursor: pointer;
  border-radius: 6px;
  padding: 6px;
  margin: 0 -6px;
  transition: background .12s;
}
.sources .src.clickable:hover { background: #eff6ff; }
.sources .src.clickable:hover .jump { text-decoration: underline; }
.sources .src .jump { color: var(--primary); font-size: 11px; }
.sources .src .loc { color: #94a3b8; font-size: 11px; }

/* ---------- 原文查看器 ---------- */
#rawView {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, .45);
  display: none;
  z-index: 60;
  padding: 28px;
}
#rawView.open { display: flex; }
.raw-panel {
  background: var(--panel);
  border-radius: var(--radius);
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(15, 23, 42, .3);
}
.raw-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  background: #f8fafc;
}
.raw-head .title { font-size: 13px; font-weight: 600; color: var(--text); }
.raw-head .meta { font-size: 12px; color: var(--text-2); }
.raw-head .spacer { flex: 1; }
.raw-body { flex: 1; overflow: auto; background: #fdfefe; }
.raw-inner {
  display: flex;
  align-items: flex-start;
  font-family: ui-monospace, Consolas, "Courier New", monospace;
  font-size: 12.5px;
  line-height: 20px;
  min-height: 100%;
}
.raw-gutter {
  flex: 0 0 auto;
  padding: 10px 8px 24px 12px;
  text-align: right;
  color: #94a3b8;
  background: #f1f5f9;
  border-right: 1px solid var(--border);
  position: sticky;
  left: 0;
  z-index: 2;
  user-select: none;
  white-space: pre;
}
.raw-code {
  flex: 1 0 auto;
  padding: 10px 16px 24px 12px;
  white-space: pre;
  color: var(--text);
  position: relative;
  /* z-index:0 让这一列自成层叠上下文，配合高亮带的 z-index:-1 才能把色块压到文字下面 */
  z-index: 0;
  tab-size: 4;
}
.raw-code .hl {
  position: absolute;
  left: 0;
  right: 0;
  background: #fef9c3;
  border-left: 3px solid #eab308;
  pointer-events: none;
  /* 必须压在文字下层：绝对定位的元素默认绘制在行内文字之上，不设负层级会把正文整块盖住 */
  z-index: -1;
}
.raw-note { padding: 28px; color: var(--text-2); font-size: 13px; line-height: 1.9; max-width: 640px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>企业知识库问答助手</h1>
    <div class="sub">RAG Agent · 文档入库 / 混合检索 / 多轮对话</div>
  </div>
  <div style="font-size:12px;opacity:.8" id="apiStatus">检测中…</div>
</header>

<main>
  <aside>
    <section>
      <h2>知识库文档</h2>
      <div class="upload-row">
        <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx">
        <button class="btn btn-primary" id="uploadBtn">上传</button>
      </div>
      <div id="docList" style="margin-top:12px"></div>
    </section>
    <section>
      <h2>会话</h2>
      <button class="btn btn-primary" id="newChatBtn">新建会话</button>
      <div id="convList"></div>
    </section>
  </aside>

  <div id="chatArea">
    <div id="messages"></div>
    <div id="inputBar">
      <textarea id="question" rows="2" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="btn btn-primary" id="sendBtn">发送</button>
    </div>
    <div id="statusBar">就绪</div>
  </div>
</main>

<!-- 原文查看器：点引用来源时打开，滚到被引用的那几行并高亮 -->
<div id="rawView">
  <div class="raw-panel">
    <div class="raw-head">
      <span class="title" id="rawTitle">原文</span>
      <span class="meta" id="rawMeta"></span>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="rawClose">关闭</button>
    </div>
    <div class="raw-body" id="rawBody"></div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let currentConvId = null;

  /* ---------- 工具 ---------- */
  const esc = (s) => (s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function api(url, opts) {
    const r = await fetch(url, opts);
    if (!r.ok) {
      let msg = "HTTP " + r.status;
      try { const b = await r.json(); msg = (b.code ? b.code + "：" : "") + (b.error || msg); } catch (e) {}
      throw new Error(msg);
    }
    return r.json();
  }

  function status(text) { $("statusBar").textContent = text; }

  /* ---------- 引用来源：渲染 + 跳转原文 ---------- */
  // 每条来源带四个定位字段：documentId / startLine / endLine / chunkIndex。
  // 有 documentId 且行号 > 0 的才能跳；老数据入库时既没存原文也没记行号，只能显示文档名。
  function sourcesHtml(list) {
    return '<details' + (list.length <= 3 ? ' open' : '') + '><summary>参考来源（' + list.length + ' 条）</summary>' +
      list.map(s => {
        const canJump = !!(s.documentId && s.startLine > 0);
        const loc = canJump ? ('第 ' + s.startLine + '–' + s.endLine + ' 行') : '无行号定位';
        const attrs = canJump
          ? ' class="src clickable" data-doc="' + esc(s.documentId) + '" data-start="' + s.startLine +
            '" data-end="' + s.endLine + '" data-name="' + esc(s.sourceName) + '"'
          : ' class="src"';
        const tail = canJump
          ? ' <span class="jump">跳转 ' + loc + ' ↗</span>'
          : ' <span class="loc">' + loc + '</span>';
        return '<div' + attrs + '><b>' + esc(s.sourceName) + '</b> ' +
          '<span class="score">相关度 ' + (s.similarity * 100).toFixed(0) + '% / 词法 ' +
          (s.lexicalScore * 100).toFixed(1) + '%</span>' + tail + '<br>' +
          esc(s.snippet || '') + '</div>';
      }).join('') + '</details>';
  }

  const rawCache = new Map();   // documentId -> 原文；null 表示该文档没存原文
  const LINE_H = 20;            // 与 .raw-inner 的 line-height 一致，高亮带靠它算位置
  const CODE_PAD = 10;          // 与 .raw-code 的 padding-top 一致

  function closeRaw() { $("rawView").classList.remove("open"); }

  async function openRaw(docId, start, end, name) {
    const body = $("rawBody");
    $("rawView").classList.add("open");
    $("rawTitle").textContent = name || "原文";
    $("rawMeta").textContent = "";
    body.scrollTop = 0;

    let raw = rawCache.get(docId);
    if (raw === undefined) {
      body.innerHTML = '<div class="raw-note">正在加载原文…</div>';
      try {
        const r = await api("/api/documents/" + encodeURIComponent(docId) + "/raw");
        raw = r.hasRaw ? String(r.rawText).replace(/\r\n?/g, "\n") : null;
        rawCache.set(docId, raw);
        if (raw === null) {
          body.innerHTML = '<div class="raw-note">' + esc(r.note || "该文档未保留原文。") + '</div>';
          return;
        }
      } catch (e) {
        body.innerHTML = '<div class="raw-note">原文加载失败：' + esc(e.message) + '</div>';
        return;
      }
    }
    if (raw === null) {
      body.innerHTML = '<div class="raw-note">该文档入库时未保留原文（早期版本只存分块）。重新上传同一文件即可获得行级定位。</div>';
      return;
    }

    const total = raw.split("\n").length;
    const hlTop = CODE_PAD + (start - 1) * LINE_H;
    const hlHeight = Math.max(1, end - start + 1) * LINE_H;

    // 行号列与正文列各用一个 pre：不用逐行 div 是因为上万行会生成上万个节点，滚动会卡死。
    // 高亮带是绝对定位的 span，位置由「行号 × 行高」算出，不依赖文本测量。
    body.innerHTML =
      '<div class="raw-inner">' +
        '<pre class="raw-gutter">' + Array.from({ length: total }, (_, i) => i + 1).join("\n") + '</pre>' +
        '<pre class="raw-code">' +
          '<span class="hl" style="top:' + hlTop + 'px;height:' + hlHeight + 'px"></span>' +
          esc(raw) +
        '</pre>' +
      '</div>';
    $("rawMeta").textContent = "共 " + total + " 行 · 引用第 " + start + "–" + end + " 行";
    body.scrollTop = Math.max(0, hlTop - 90);
  }

  // 事件委托：来源是动态插入的，逐个绑定会漏掉后追加的消息
  document.addEventListener("click", (e) => {
    const src = e.target.closest(".src.clickable");
    if (src) {
      openRaw(src.dataset.doc, +src.dataset.start, +src.dataset.end, src.dataset.name);
      return;
    }
    if (e.target.id === "rawClose" || e.target.id === "rawView") {
      closeRaw();
    }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeRaw(); });

  function addMsg(role, text, sources, isErr) {
    const div = document.createElement("div");
    div.className = "msg " + role + (isErr ? " err" : "");
    div.innerHTML = esc(text);
    if (sources && sources.length) {
      const box = document.createElement("div");
      box.className = "sources";
      box.innerHTML = sourcesHtml(sources);
      div.appendChild(box);
    }
    $("messages").appendChild(div);
    $("messages").scrollTop = $("messages").scrollHeight;
    return div;
  }

  /* ---------- 文档 ---------- */
  async function loadDocs() {
    try {
      const docs = await api("/api/documents");
      $("docList").innerHTML = docs.length ? "" : '<div class="empty-hint">暂无文档，请上传</div>';
      docs.forEach(d => {
        const item = document.createElement("div");
        item.className = "list-item";
        const badge = d.status === "DONE" ? '<span class="badge ok">已入库</span>' :
          d.status === "FAILED" ? '<span class="badge err">失败</span>' : '<span class="badge">' + esc(d.status || "") + '</span>';
        item.innerHTML = '<div><div>' + esc(d.name) + '</div><div class="meta">' + d.chunk_count + " 个分块 · " +
          new Date(d.created_at).toLocaleString() + '</div></div><div style="display:flex;gap:6px;align-items:center">' + badge +
          '<button class="btn btn-danger" data-id="' + d.id + '" title="删除">删除</button></div>';
        item.querySelector("div:first-child").addEventListener("click", () => openDoc(d.id, d.name));
        item.querySelector("[data-id]").addEventListener("click", async (e) => {
          e.stopPropagation();
          if (!confirm("删除文档「" + d.name + "」及其分块？")) return;
          try {
            await api("/api/documents/" + d.id, { method: "DELETE" });
            status("文档已删除");
            loadDocs();
          } catch (err) { status("删除失败：" + err.message); }
        });
        $("docList").appendChild(item);
      });
    } catch (err) { $("docList").innerHTML = '<div class="empty-hint">加载失败：' + esc(err.message) + "</div>"; }
  }

  function openDoc(id, name) {
    status("加载文档内容…");
    api("/api/documents/" + id + "/content").then(doc => {
      $("messages").innerHTML = "";
      addMsg("system", "正在查看文档「" + doc.name + "」 · " + (doc.file_type || "") + " · " +
        doc.chunk_count + " 个分块 · " + new Date(doc.created_at).toLocaleString());
      const fullText = (doc.chunks || []).map(c => c.content || "").join("\n\n").trim();
      addMsg("assistant", fullText || "（该文档暂无内容）");
      status("文档内容已加载");
    }).catch(err => {
      status("加载文档失败：" + err.message);
      addMsg("system", "文档加载失败：" + err.message, null, true);
    });
  }

  $("uploadBtn").addEventListener("click", async () => {
    const f = $("fileInput").files[0];
    if (!f) { status("请先选择文件"); return; }
    const fd = new FormData();
    fd.append("file", f);
    $("uploadBtn").disabled = true;
    status("上传 " + f.name + " …");
    try {
      // 入库是异步的：接口立刻返回 202（已受理），真正的解析/向量化在消费者里跑。
      // 所以这里不能报「入库完成」，只能报「已受理」，然后轮询状态直到 DONE / FAILED。
      const r = await api("/api/documents", { method: "POST", body: fd });
      if (r.status === "DONE") {
        status("秒传成功：" + f.name + "（内容已存在，复用已有文档）");
        addMsg("system", "文档「" + f.name + "」内容已存在，直接复用");
      } else {
        status("已受理：" + f.name + "，后台解析中…");
        addMsg("system", "文档「" + f.name + "」已提交，正在后台解析入库");
      }
      $("fileInput").value = "";
      await loadDocs();
      if (r.status !== "DONE") pollDoc(r.documentId, f.name);
    } catch (err) {
      status("上传失败：" + err.message);
      addMsg("system", "文档「" + f.name + "」上传失败：" + err.message, null, true);
    } finally { $("uploadBtn").disabled = false; }
  });

  // 轮询刚上传的文档：每 1.5 秒查一次，直到 DONE / FAILED 或超过 5 分钟。
  // 为什么要轮询而不是等接口返回：入库耗时取决于分块数和 embedding 速度（0.9MB PDF 约 60 秒+），
  // 让它同步等会把连接拖到网关超时，那正是这次改成 MQ 的原因。
  async function pollDoc(id, name) {
    const deadline = Date.now() + 5 * 60 * 1000;
    while (Date.now() < deadline) {
      await new Promise(res => setTimeout(res, 1500));
      try {
        const list = await api("/api/documents");
        const doc = list.find(d => d.id === id);
        if (!doc) return;
        if (doc.status === "DONE") {
          status("入库完成：" + name + "（" + doc.chunk_count + " 块）");
          addMsg("system", "文档「" + name + "」已入库，" + doc.chunk_count + " 个分块");
          loadDocs();
          return;
        }
        if (doc.status === "FAILED") {
          status("入库失败：" + name);
          addMsg("system", "文档「" + name + "」入库失败：" + (doc.error_msg || "未知原因"), null, true);
          loadDocs();
          return;
        }
        const p = doc.segment_total
          ? "（第 " + doc.segment_done + "/" + doc.segment_total + " 段）" : "";
        status("后台解析中 " + name + p);
        loadDocs();
      } catch (e) { /* 轮询期间的网络抖动忽略，下一轮继续 */ }
    }
    status("入库仍在进行：" + name + "，可稍后刷新文档列表查看");
  }

  /* ---------- 会话 ---------- */
  async function loadConvs() {
    try {
      const convs = await api("/api/conversations");
      $("convList").innerHTML = convs.length ? "" : '<div class="empty-hint">暂无历史会话</div>';
      convs.forEach(c => {
        const item = document.createElement("div");
        item.className = "list-item" + (c.id === currentConvId ? " active" : "");
        item.innerHTML = '<div><div>' + esc(c.title || "未命名会话") + '</div><div class="meta">' +
          new Date(c.created_at).toLocaleString() + " · " + c.message_count + " 条消息</div></div>" +
          '<button class="btn btn-danger" data-id="' + c.id + '">删除</button>';
        item.querySelector("div:first-child").addEventListener("click", () => openConv(c.id));
        item.querySelector("[data-id]").addEventListener("click", async (e) => {
          e.stopPropagation();
          if (!confirm("删除该会话及其消息？")) return;
          try {
            await api("/api/conversations/" + c.id, { method: "DELETE" });
            if (c.id === currentConvId) { currentConvId = null; $("messages").innerHTML = ""; }
            status("会话已删除");
            loadConvs();
          } catch (err) { status("删除失败：" + err.message); }
        });
        $("convList").appendChild(item);
      });
    } catch (err) { $("convList").innerHTML = '<div class="empty-hint">加载失败：' + esc(err.message) + "</div>"; }
  }

  function openConv(id) {
    currentConvId = id;
    $("messages").innerHTML = "";
    status("加载历史消息…");
    api("/api/conversations/" + encodeURIComponent(id) + "/messages").then(msgs => {
      if (!msgs.length) {
        addMsg("system", "该会话暂无消息");
      } else {
        msgs.forEach(m => {
          if (m.role === "user") {
            addMsg("user", m.content || "");
          } else if (m.role === "assistant" || m.role === "ai") {
            // langchain4j 持久化时角色写的是 ChatMessageType.AI 小写 "ai"，
            // 历史数据里也可能存 "assistant"，两种都要渲染成助手气泡。
            addMsg("assistant", m.content || "");
          } else if (m.role === "system") {
            addMsg("system", m.content || "");
          }
        });
        status("已加载 " + msgs.length + " 条历史消息");
      }
    }).catch(err => {
      status("加载历史失败：" + err.message);
    });
    loadConvs();
  }

  $("newChatBtn").addEventListener("click", () => {
    currentConvId = null;
    $("messages").innerHTML = "";
    status("新会话（提交首问后自动创建）");
  });

  /* ---------- 聊天 ---------- */
  async function send() {
    const q = $("question").value.trim();
    if (!q) return;
    $("question").value = "";
    addMsg("user", q);

    const typing = addMsg("assistant", "");
    typing.classList.add("typing");
    // 演示视角：一次问答要串 2~3 次模型调用（检索改写 / 生成 / 拒答判定）。
    // 实测首字 15~35 秒（长上下文时上游更慢），这段时间只放一个光标看起来就是"点了没反应"。
    // 先把预期写清楚，等后端 stage 事件和首字到达后再逐步覆盖成更具体的信息。
    typing.textContent = "正在检索知识库并生成回答，首字通常 15~35 秒…";
    status("正在检索并生成…");

    const payload = { question: q };
    if (currentConvId) payload.conversationId = currentConvId;

    // 流式失败（连接中断 / 模型错误 / 上游报错）一律回退同步接口：
    // 同步路径自带重试，尽量让用户拿到完整回答，而不是一行错误。
    const fallbackSync = async (errNote) => {
      typing.classList.remove("typing");
      try {
        const res = await api("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        typing.textContent = res.answer || "";
        if (res.conversationId) currentConvId = res.conversationId;
        if (res.refused) { typing.textContent = res.answer; }
        if (res.sources && res.sources.length) {
          const box = document.createElement("div");
          box.className = "sources";
          box.innerHTML = sourcesHtml(res.sources);
          typing.appendChild(box);
        }
        $("messages").scrollTop = $("messages").scrollHeight;
        status("完成（同步）");
        loadConvs();
      } catch (e2) {
        typing.textContent = (errNote ? errNote + "，" : "请求失败：") + e2.message;
        typing.classList.add("err");
        status("失败：" + e2.message);
      }
    };

    // 流式优先；失败则回退同步接口
    try {
      const r = await fetch("/api/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!r.ok || !r.headers.get("content-type")?.includes("text/event-stream")) {
        throw new Error("HTTP " + r.status);
      }
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      let doneMeta = null;
      let sseError = null;

      // 手动解析 SSE 帧（event/data 分行）
      let curEvent = "";
      let waiting = true;   // 占位文案还没被首字覆盖
      const dispatch = (data) => {
        if (curEvent === "error") {
          sseError = data;
        } else if (curEvent === "stage") {
          // 检索结果已经在后端算完（约 200 毫秒），先用它替换掉"正在检索"的笼统提示。
          // 这一步的意义不是让结果变快，而是让 20~40 秒的模型等待期里始终有可见进度。
          try {
            const info = JSON.parse(data);
            if (waiting && !info.refused) {
              typing.textContent = info.message + "（首字还需约 15~30 秒）…";
            } else if (waiting) {
              typing.textContent = info.message + "…";
            }
            status(info.message);
          } catch (e) {}
        } else if (curEvent === "done") {
          // 流结束但一个字都没流出来（例如被拒答且没有正文）时，别把占位文案留在气泡里。
          if (waiting) { typing.textContent = ""; waiting = false; }
          try { doneMeta = JSON.parse(data); } catch (e) {}
        } else if (curEvent === "text" || curEvent === "") {
          if (waiting) { typing.textContent = ""; waiting = false; }
          typing.textContent += data;
          $("messages").scrollTop = $("messages").scrollHeight;
        }
        curEvent = "";
      };
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const frame = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          frame.split("\n").forEach(l => {
            if (l.startsWith("event:")) curEvent = l.slice(6).trim();
            else if (l.startsWith("data:")) dispatch(l.slice(5).trim());
          });
        }
      }
      typing.classList.remove("typing");
      if (sseError) {
        // 流式断了要回退同步接口，那又是一次完整等待。不写清楚的话，
        // 用户会觉得"回答到一半卡住了"，而实际上后台正在重新生成。
        typing.textContent = "生成中断，正在改用同步接口重新生成（约需 20~40 秒）…";
        await fallbackSync("（模型错误）" + sseError);
      } else if (doneMeta) {
        if (doneMeta.conversationId) currentConvId = doneMeta.conversationId;
        addMsg("system", "token 用量：" + doneMeta.promptTokens + " 输入 / " + doneMeta.completionTokens + " 输出" +
          (doneMeta.refused ? " · 已拒答" : ""));
        if (doneMeta.sources && doneMeta.sources.length) {
          const box = document.createElement("div");
          box.className = "sources";
          box.innerHTML = sourcesHtml(doneMeta.sources);
          typing.appendChild(box);
        }
        $("messages").scrollTop = $("messages").scrollHeight;
        status("完成");
        loadConvs();
      } else {
        status("流结束但未收到 done 事件");
      }
    } catch (err) {
      await fallbackSync();
    }
  }

  $("sendBtn").addEventListener("click", send);
  $("question").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  /* ---------- 健康检查 ---------- */
  async function checkApi() {
    try {
      await api("/api/documents");
      $("apiStatus").textContent = "API 正常";
      $("apiStatus").style.color = "#bbf7d0";
    } catch (e) {
      $("apiStatus").textContent = "API 异常：" + e.message;
      $("apiStatus").style.color = "#fecaca";
    }
  }

  loadDocs();
  loadConvs();
  checkApi();
})();
</script>
</body>
</html>
